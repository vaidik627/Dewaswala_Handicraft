<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders — Dewaswala Handicrafts</title>
<style>
  :root{--maroon:#6b1f2e;--maroon-ink:#4a1420;--bg:#fbf6ee;--surface:#fff;--ink:#2a1a1d;--muted:#7a6a6d;--line:#e6dcd2}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{background:var(--maroon-ink);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header h1{font-size:1.05rem;margin:0;font-weight:700}
  header a{color:#fff;font-size:.9rem;border:1px solid rgba(255,255,255,.4);padding:6px 12px;border-radius:8px;text-decoration:none}
  main{max-width:1200px;margin:18px auto;padding:0 18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  input{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;min-width:240px}
  table{border-collapse:collapse;width:100%;font-size:.88rem}
  th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
  th{font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-top:0}
  .msg{padding:10px 12px;border-radius:8px;background:#fbe9ea;color:#a4262c;margin:10px 0}
</style>
</head>
<body>
<header>
  <h1>Orders</h1>
  <span><a href="/admin/customers.html">Customers</a> <a href="/admin/">Catalog</a> <a href="/admin/slider.html">Homepage slider</a></span>
</header>
<main>
  <div class="card">
    <div class="top"><strong id="count"></strong><input id="q" type="search" placeholder="Search order no, name, mobile"></div>
    <div id="msg"></div>
    <table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>WhatsApp</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
</main>
<script>
  const token = sessionStorage.getItem('dwToken') || '';
  const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let all = [];
  function draw(){
    const q = document.getElementById('q').value.trim().toLowerCase();
    const list = all.filter(o => !q || [o.orderNo, o.name, o.phone].join(' ').toLowerCase().includes(q));
    document.getElementById('count').textContent = list.length + ' of ' + all.length + ' orders';
    document.getElementById('rows').innerHTML = list.map(o => '<tr><td><b>' + esc(o.orderNo) + '</b><br><small>' + new Date(o.createdAt).toLocaleString('en-IN') + '</small></td><td>' + esc(o.name) + '<br>' + esc(o.phone) + (o.company ? '<br><small>' + esc(o.company) + '</small>' : '') + '<br><small>' + esc(o.address) + '</small></td><td>' + o.items.map(i => esc(i.name) + ' (' + esc(i.sku) + ') × ' + i.qty).join('<br>') + (o.note ? '<br><small><i>Note: ' + esc(o.note) + '</i></small>' : '') + '</td><td>₹' + Number(o.total).toLocaleString('en-IN') + '</td><td>' + (o.waSent ? 'Sent' : 'Customer tap') + '</td></tr>').join('');
  }
  document.getElementById('q').addEventListener('input', draw);
  (async function(){
    if (!token) { document.getElementById('msg').innerHTML = '<div class="msg">Please log in on the <a href="/admin/">catalog admin</a> first, then come back here.</div>'; return; }
    const res = await fetch('/api/admin/orders', { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) { document.getElementById('msg').innerHTML = '<div class="msg">Please log in again on the <a href="/admin/">catalog admin</a>.</div>'; return; }
    all = await res.json(); draw();
  })();
</script>
</body>
</html>
